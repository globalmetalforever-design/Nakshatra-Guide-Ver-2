<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nakshatra Guide & Astrological Study Suite</title>
    <link rel="stylesheet" href="style.css?v=280">
    <style>
        select option {
            background-color: #0b1326 !important;
            color: #ffffff !important;
            padding: 10px;
        }
        .horizon-tab-btn {
            background: #111c34;
            color: #cbd5e1;
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 0.4px;
        }
        .horizon-tab-btn.active-horizon-tab {
            background: #caa437;
            color: #060d1a;
            border-color: #ffd700;
        }
    </style>
</head>
<body>

    <canvas id="starfield-bg"></canvas>

    <div class="dashboard-container" style="max-width: 900px; margin: 0 auto; padding: 20px;">

        <!-- Center Branding Header -->
        <div class="card branding-card-panel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-bottom: 20px;">
            <div class="branding-image-container">
                <img src="ng head.jpg" alt="Nakshatra Guide Logo" class="scaled-panel-img">
            </div>
        </div>

        <!-- NEW USERS ONLY: Onboarding Container (All Inputs Collected at DOB Stage) -->
        <div id="newUserDataRow" class="dashboard-row-three-columns" style="display: none; margin-bottom: 20px;">
            <div class="card outlined-card" id="profileFormPanel">
                <div class="card-header">Astrological Profile</div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="dob">Date of Birth (DD-MM-YYYY)</label>
                        <input type="text" id="dob" placeholder="DD-MM-YYYY" maxlength="10" required>
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        <label for="tob">Time of Birth</label>
                        <input type="time" id="tob" required>
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        <label for="genderSelect">Gender</label>
                        <select id="genderSelect" style="width: 100%; background: #0b1326; border: 1px solid rgba(255,215,255,0.25); color: #fff; padding: 9px; border-radius: 4px; font-family: inherit;">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="unspecified">Prefer not to say</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        <label for="occupationStatusSelect">Current Status</label>
                        <select id="occupationStatusSelect" style="width: 100%; background: #0b1326; border: 1px solid rgba(255,215,255,0.25); color: #fff; padding: 9px; border-radius: 4px; font-family: inherit;">
                            <option value="working">Working</option>
                            <option value="non_working">Non Working</option>
                            <option value="student">Student</option>
                            <option value="business">Business</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        <label for="workNatureInput">Nature of Work / Business / Role</label>
                        <input type="text" id="workNatureInput" placeholder="e.g. Businessman, Actor, Politician, School Student, College Student, No Work">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                        <div class="form-group">
                            <label for="houseStatusSelect">House</label>
                            <select id="houseStatusSelect" style="width: 100%; background: #0b1326; border: 1px solid rgba(255,215,255,0.25); color: #fff; padding: 9px; border-radius: 4px; font-family: inherit;">
                                <option value="own">Own House</option>
                                <option value="rented">Rented Property</option>
                                <option value="shared">Family / Shared</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="vehicleStatusSelect">Vehicle</label>
                            <select id="vehicleStatusSelect" style="width: 100%; background: #0b1326; border: 1px solid rgba(255,215,255,0.25); color: #fff; padding: 9px; border-radius: 4px; font-family: inherit;">
                                <option value="own">Own Vehicle</option>
                                <option value="none">No Vehicle / Transit</option>
                                <option value="planning">Planning to Buy</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        <label for="birth-place-input">Place of Birth (City)</label>
                        <input type="text" id="birth-place-input" placeholder="e.g. Bengaluru" value="Bengaluru">
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        <label for="country-input">Country</label>
                        <input type="text" id="country-input" placeholder="e.g. India" value="India">
                    </div>

                    <button id="submitBtn" class="btn primary-btn" style="margin-top: 18px; width: 100%;">Submit</button>
                </div>
            </div>

            <div class="card outlined-card" id="detectedStatusPanel">
                <div class="card-header">Detected Birth Coordinates</div>
                <div class="card-body">
                    <div id="detectedNakshatra" class="highlight-text">Waiting for Birth Details</div>
                    <div id="detectedPada" class="sub-highlight-text"></div>
                    <div class="rasi-zodiac-details" style="margin-top: 15px;">
                        <div>Vedic Sign (Rasi): <strong id="vedicRasi">-</strong></div>
                        <div style="margin-top: 8px;">Western Sun Sign: <strong id="westernZodiac">-</strong></div>
                    </div>
                    <div class="action-buttons-group" style="margin-top: 20px;">
                        <button id="confirmBtn" style="display: none;" class="btn confirm-btn">Confirm Details</button>
                        <button id="rejectBtn" style="display: none;" class="btn reject-btn">Reject</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ASTROLOGICAL FORECAST SUITE + 4 AUTO-RENDERING TABS -->
        <div id="studyControlCard" class="card" style="display: none; margin-bottom: 20px; background: rgba(10, 18, 35, 0.92); border: 1px solid rgba(255, 215, 0, 0.3);">
            <div class="card-header"><h3 id="forecastSuiteTitle">Forecast Suite : "Profile details"</h3></div>
            <div class="card-body" style="display: flex; flex-direction: column; gap: 16px;">

                <!-- 4 Tabs: WEEK, MONTH, YEAR, GENERAL -->
                <div id="fourTabsBar" style="display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,215,0,0.15);">
                    <button id="tabWeekBtn" class="horizon-tab-btn active-horizon-tab" data-tab="week">WEEK</button>
                    <button id="tabMonthBtn" class="horizon-tab-btn" data-tab="month">MONTH</button>
                    <button id="tabYearBtn" class="horizon-tab-btn" data-tab="year">YEAR</button>
                    <button id="tabGeneralBtn" class="horizon-tab-btn" data-tab="general">GENERAL</button>
                </div>

                <!-- Automatic Combined Prediction Output for Active Tab -->
                <div id="tabDisplayPanel" style="padding: 16px; background: rgba(0, 0, 0, 0.34); border-left: 3px solid #caa437; border-radius: 5px; min-height: 120px; font-size: 0.96rem; line-height: 1.68; color: #e2e8f0;">
                    Loading combined forecast...
                </div>

                <div style="display: flex; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px dashed rgba(255,215,0,0.2); padding-top: 14px;">
                    <div id="suiteActionHint" style="font-size: 0.82rem; color: rgba(255,255,255,0.7);">
                        Combined synthesis across traditions automatically updates per tab.
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button id="generateInsightBtn" class="btn primary-btn" style="padding: 10px 20px; font-weight: bold;">Generate Report</button>
                        <button id="viewCompleteReportBtn" class="btn" style="background: #2a3b5f; color: #fff; padding: 10px 16px; border-radius: 4px; border: 1px solid rgba(255,215,215,0.3); cursor: pointer;">📄 View Ledger (<span id="reportCountBadge">0</span>)</button>
                    </div>
                </div>

                <div style="margin-top: 2px; display: flex; justify-content: space-between; align-items: center;">
                    <button id="hiddenOwnerTrigger" style="background: none; border: none; color: rgba(255, 255, 255, 0.14); cursor: pointer; font-size: 0.72rem; padding: 0;">owner</button>
                    <button id="resetProfileLink" style="background: none; border: none; color: rgba(255, 255, 255, 0.5); cursor: pointer; font-size: 0.82rem; text-decoration: underline; padding: 0;">Reset profile & re-enter details</button>
                </div>

            </div>
        </div>

    </div>

    <!-- EXISTING REPORT POP-UP MODAL FORMAT -->
    <div id="predictionModalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.82); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #0b1326; border: 1px solid #ffd700; width: 92%; max-width: 780px; max-height: 88vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.9);">
            <div style="background: #141e38; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.15);">
                <h3 id="modalTitle" style="margin: 0; color: #ffd700; font-size: 1.1rem;">Astrological Report</h3>
                <button id="closeModalBtn" style="background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;">✕</button>
            </div>
            <div id="modalBodyContent" style="padding: 22px; overflow-y: auto; font-size: 1.02rem; line-height: 1.75; color: #e2e8f0; max-height: 68vh;">
                <!-- Dynamic Content -->
            </div>
            <div style="background: #141e38; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,215,0,0.15);">
                <div style="display: flex; gap: 10px;">
                    <button id="modalDeleteReportBtn" class="btn" style="background: #a83232; color: #fff; font-weight: bold; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Delete Report</button>
                    <button id="modalSaveReportBtn" class="btn" style="background: #2e7d32; color: #fff; font-weight: bold; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Save Report (TXT)</button>
                </div>
                <button id="modalCloseActionBtn" class="btn" style="background: #caa437; color: #060d1a; font-weight: bold; padding: 6px 18px; border-radius: 4px; cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/index_app.js?v=280"></script>
</body>
</html>
